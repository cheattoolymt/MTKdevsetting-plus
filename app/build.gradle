plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nyan4.hiddensettings'
    compileSdk 28

    defaultConfig {
        applicationId 'com.nyan4.hiddensettings'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Xposed API: provided by the LSPosed framework at runtime, so compileOnly.
    // Do NOT bundle it into the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
